# #######################################################################################
# ASASHI HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This configuration file use a modular concept
# you can find and modify all of the file bellow.

# Monitors configuration file
source = ~/.config/hypr/modules/monitors.conf
# Programs & bin configuration file
source = ~/.config/hypr/modules/execs.conf
# Autostart configuration file
source = ~/.config/hypr/modules/autostart.conf
# Env configuration file
source = ~/.config/hypr/modules/env.conf
# Permission configuration file
source = ~/.config/hypr/modules/permissions.conf
# General configuration file
source = ~/.config/hypr/modules/general.conf
# Colors configuration file
source = ~/.config/hypr/modules/colors.conf
# Decoration configuration file
source = ~/.config/hypr/modules/decoration.conf
# Animations configuration file
source = ~/.config/hypr/modules/animations.conf
# Input configuration file
source = ~/.config/hypr/modules/input.conf
# Keybindings configuration file
source = ~/.config/hypr/modules/keybindings.conf
# Window-Rules configuration file
source = ~/.config/hypr/modules/windowrules.conf


