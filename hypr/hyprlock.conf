# ================================================
# hyprlock.conf
# Colors sourced from matugen generated colors.conf
# ================================================

source = ~/.config/hypr/colors.conf

general {
    hide_cursor         = true
    ignore_empty_input  = false
}

# ── Background ──────────────────────────────────
background {
    monitor     =
    path        = $image
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.6
    contrast    = 1.0
    vibrancy    = 0.2
}

# ── Clock ───────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date '+%H:%M')"
    color       = $on_background
    font_size   = 72
    font_family = JetBrains Mono Bold
    position    = 0, 220
    halign      = center
    valign      = center
    shadow_passes = 2
    shadow_color  = $background
}

# ── Date ────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date '+%A, %B %d')"
    color       = $on_surface_variant
    font_size   = 20
    font_family = JetBrains Mono
    position    = 0, 140
    halign      = center
    valign      = center
    shadow_passes = 1
    shadow_color  = $background
}

# ── User ────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:0] echo "  $USER"
    color       = $secondary
    font_size   = 16
    font_family = JetBrains Mono
    position    = 0, 10
    halign      = center
    valign      = center
}

# ── Input field ─────────────────────────────────
input-field {
    monitor           =
    size              = 350, 55
    outline_thickness = 3
    dots_size         = 0.3
    dots_spacing      = 0.2
    dots_center       = true

    outer_color       = $primary
    inner_color       = $surface_container
    font_color        = $on_surface
    check_color       = $tertiary
    fail_color        = $error
    capslock_color    = $secondary

    fade_on_empty     = true
    fade_timeout      = 1000
    placeholder_text  = <i>Password</i>
    hide_input        = false
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position          = 0, -120
    halign            = center
    valign            = center
}

