[config.wallpaper]
command = "awww"
arguments = ["img", "--transition-type", "center", "--transition-step", "15", "--transition-fps", "60"]
set = true

[templates.hyprland]
input_path = '/home/sam/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.kitty]
input_path = '/home/sam/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.neovim]
input_path = '/home/sam/.config/matugen/templates/nvim-colors.conf'
output_path = '~/.config/nvim/generated.lua'
post_hook = 'pkill -SIGUSR1 nvim'

[templates.waybar]
input_path = '/home/sam/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.rofi]
input_path = '/home/sam/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.swaync]
input_path = '/home/sam/.config/matugen/templates/colors.css'
output_path = '~/.config/swaync/colors.css'
post_hook = 'pkill swaync'

[templates.obsidian_homelab]
input_path  = "~/.config/matugen/templates/obsidian.css"
output_path = "~/Documents/HomeLab-Vault/.obsidian/snippets/matugen-colors.css"

[templates.obsidian_steams]
input_path  = "~/.config/matugen/templates/obsidian.css"
output_path = "~/Documents/steams/.obsidian/snippets/matugen-colors.css"

[templates.firefox-website-colors]
input_path = "~/.config/matugen/templates/firefox-colors.css"
output_path = "~/.config/mozilla/firefox/lgyhyd1a.default-release/chrome/colors.css"

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.wlogout]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/wlogout/colors.css'

[templates.swaylock]
input_path = '~/.config/matugen/templates/swaylock.conf'
output_path = '~/.config/swaylock/config'

[templates.sddm]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '/tmp/sddm-unused.conf'
post_hook = 'update-sddm-theme {{ image }}'

