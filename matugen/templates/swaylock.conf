# Swaylock config
# Generated by Matugen - DO NOT EDIT MANUALLY

# Background - your wallpaper blurred
screenshots
effect-blur=10x5
effect-vignette=0.5:0.5
fade-in=0.2

# Clock
clock
timestr=%I:%M %p
datestr=%A, %B %d

# Font
font=JetBrainsMono Nerd Font
font-size=55

# Background color fallback
color={{colors.surface.default.hex_stripped}}ff

# Ring colors
ring-color={{colors.outline.default.hex_stripped}}ff
ring-ver-color={{colors.primary.default.hex_stripped}}ff
ring-wrong-color={{colors.error.default.hex_stripped}}ff
ring-clear-color={{colors.tertiary.default.hex_stripped}}ff

# Key highlights
key-hl-color={{colors.primary.default.hex_stripped}}ff
bs-hl-color={{colors.error.default.hex_stripped}}ff

# Text
text-color={{colors.on_surface.default.hex_stripped}}ff
text-ver-color={{colors.on_surface.default.hex_stripped}}ff
text-wrong-color={{colors.on_error_container.default.hex_stripped}}ff
text-clear-color={{colors.on_surface.default.hex_stripped}}ff

# Inside of the ring
inside-color={{colors.surface_container.default.hex_stripped}}cc
inside-ver-color={{colors.primary_container.default.hex_stripped}}cc
inside-wrong-color={{colors.error_container.default.hex_stripped}}cc
inside-clear-color={{colors.tertiary_container.default.hex_stripped}}cc

# Separator line between ring and inside
separator-color=00000000

# Indicator size
indicator-radius=120
indicator-thickness=12

# Show failed attempts counter
show-failed-attempts

# Disable the default "wrong password" text replacement
# Password is shown as dots automatically by swaylock

